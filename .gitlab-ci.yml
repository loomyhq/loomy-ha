# Lint and test on every push. The GitHub workflow runs the same checks and
# additionally validates the integration for Home Assistant and HACS, which
# only exist as GitHub actions.
image: python:3.14

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

cache:
  key: pip
  paths:
    - .cache/pip

checks:
  before_script:
    - pip install -r requirements_test.txt
  script:
    - ruff check .
    - ruff format --check .
    - mypy custom_components
    - pytest
